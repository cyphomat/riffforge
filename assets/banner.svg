<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Riffforge">
  <defs>
    <linearGradient id="glut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8a23d" stop-opacity=".13"/>
      <stop offset="70%" stop-color="#e8a23d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="raster" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#ffffff" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <!-- userSpaceOnUse ist hier Pflicht: eine waagerechte Linie hat eine
         Bounding-Box ohne Höhe, und ein Verlauf in objectBoundingBox-Einheiten
         wird darauf laut Spezifikation gar nicht gezeichnet. -->
    <linearGradient id="saite" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1110" y2="0">
      <stop offset="0%" stop-color="#2c2a30"/>
      <stop offset="50%" stop-color="#6f93ad"/>
      <stop offset="100%" stop-color="#2c2a30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0c0c0e"/>
  <rect width="1200" height="300" fill="url(#raster)"/>
  <ellipse cx="600" cy="0" rx="620" ry="260" fill="url(#glut)"/>

  <!-- Sechs Saiten, von dick nach duenn -->
  <g stroke="url(#saite)" stroke-linecap="round">
    <line x1="90" y1="196" x2="1110" y2="196" stroke-width="3.4"/>
    <line x1="90" y1="212" x2="1110" y2="212" stroke-width="2.9"/>
    <line x1="90" y1="228" x2="1110" y2="228" stroke-width="2.3"/>
    <line x1="90" y1="244" x2="1110" y2="244" stroke-width="1.8"/>
    <line x1="90" y1="260" x2="1110" y2="260" stroke-width="1.3"/>
    <line x1="90" y1="276" x2="1110" y2="276" stroke-width="0.9"/>
  </g>

  <!-- Bundstaebchen, dazwischen zwei Anschlaege wie Funken -->
  <g stroke="#2c2a30" stroke-width="2">
    <line x1="300" y1="188" x2="300" y2="284"/>
    <line x1="510" y1="188" x2="510" y2="284"/>
    <line x1="720" y1="188" x2="720" y2="284"/>
    <line x1="930" y1="188" x2="930" y2="284"/>
  </g>
  <circle cx="405" cy="196" r="8" fill="#e8a23d"/>
  <circle cx="615" cy="212" r="8" fill="#e8a23d"/>

  <!-- Ganz in Bernstein und eng geführt, wie die Wortmarke in der App. Anton
       steht vorn, greift aber nur, wo sie installiert ist: eine SVG-Datei im
       README kann keine Schrift mitbringen, und Pfade statt Text wären hier
       nicht mehr zu redigieren. Oswald ist der Rückfall, und dafür ist das
       Sperrmass gesetzt. -->
  <text x="600" y="122"
        font-family="'Anton','Oswald','Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="96" font-weight="600" letter-spacing="4"
        text-anchor="middle" fill="#e8a23d">RIFFFORGE</text>

  <text x="600" y="162"
        font-family="ui-monospace,'SF Mono',Menlo,monospace"
        font-size="19" letter-spacing="7.5"
        text-anchor="middle" fill="#a7a3ab">FÜNFZEHN MINUTEN AM TAG. RIFF FÜR RIFF.</text>
</svg>
