name: Fehler melden
description: Etwas funktioniert nicht oder zeigt Falsches an.
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden. **Bitte keine echten Übungsdaten oder Log-Dateien anhängen** – eine Beschreibung reicht.
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Auf welchem Bildschirm, bei welchem Schritt?
    validations:
      required: true
  - type: textarea
    id: erwartet
    attributes:
      label: Was hättest du erwartet?
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Gerät und Browser
      description: Zum Beispiel „iPhone 15, Safari, als App installiert“ oder „Windows, Firefox“.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Fassung
      description: Steht unter *Daten → Fassung*. Mit dem Link aus der App ist es schon ausgefüllt.
