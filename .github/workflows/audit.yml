name: Audit

# `pnpm audit` bleibt leer — das ist eine Konvention, und eine Konvention, die
# nur beim nächsten Commit geprüft wird, merkt nichts, solange niemand
# committet. Neue Meldungen kommen aber nicht mit Commits, sondern mit der
# Zeit. Deshalb einmal die Woche; scheitert der Lauf, meldet GitHub das per
# Mail. Bewusst nicht im Deploy: eine fremde Meldung soll keinen Fix
# aufhalten, der gerade raus muss.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Ohne install: audit liest nur die Lockfile.
      - run: pnpm audit
