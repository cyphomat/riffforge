name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grundsätzlich nur lesen. Schreiben auf Pages und das OIDC-Token braucht
# allein der Deploy-Job — der Build führt fremden Code aus (pnpm install), und
# der soll nichts in der Hand haben, womit er die Seite austauschen könnte.
permissions:
  contents: read

# Ein Deploy zur Zeit; laufende nicht abbrechen, damit ein Release fertig wird.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions hängen an Commits, nicht an Tags: ein Tag lässt sich nachträglich
      # verschieben, ein Commit nicht. Die Fassung steht als Kommentar daneben.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version kommt aus dem Feld packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nichts geht live, was die Typen, die Tests oder den Linter reisst.
      - run: pnpm check

      - name: Build static site
        env:
          # Pages liefert unter /<repo>/ aus — ohne das greifen alle Pfade daneben.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build

      # Verhindert, dass Pages den Ordner _next als Jekyll-Internas ignoriert.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          # Ab v5 lässt die Action versteckte Dateien weg — also auch die
          # .nojekyll von eben. Bei einer Auslieferung über Actions läuft zwar
          # gar kein Jekyll; aber wenn das nicht stimmt, fehlt _next und mit
          # ihm die ganze Seite. Das Artefakt bleibt deshalb, wie es war.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
