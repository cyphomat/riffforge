name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grundsätzlich nur lesen. Schreiben auf Pages und das OIDC-Token braucht
# allein der Deploy-Job — der Build führt fremden Code aus (pnpm install), und
# der soll nichts in der Hand haben, womit er die Seite austauschen könnte.
permissions:
  contents: read

# Ein Deploy zur Zeit; laufende nicht abbrechen, damit ein Release fertig wird.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions hängen an Commits, nicht an Tags: ein Tag lässt sich nachträglich
      # verschieben, ein Commit nicht. Die Fassung steht als Kommentar daneben.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Version kommt aus dem Feld packageManager in package.json.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Nichts geht live, was die Typen, die Tests oder den Linter reisst.
      - run: pnpm check

      - name: Build static site
        env:
          # Pages liefert unter /<repo>/ aus — ohne das greifen alle Pfade daneben.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: pnpm build

      # Verhindert, dass Pages den Ordner _next als Jekyll-Internas ignoriert.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
